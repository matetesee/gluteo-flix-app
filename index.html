<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Glúteo Flix — Tu Plataforma de Entrenamiento</title>
<meta name="description" content="Secuencia activadora, entrenos y protocolos para tu Glúteo Firme.">
<meta name="robots" content="noindex">
</head>
<body>

<!-- ============================================================= -->
<!--  GLÚTEO FLIX · App (post-compra)                                -->
<!--  Basada en el VSL "Bumbum na Nuca" — adaptada y traducida al    -->
<!--  castellano. Contenido, entrenos y protocolos propios del app.  -->
<!--                                                                  -->
<!--  IMPORTANTE: todavía no hay backend.                             -->
<!--  - Todo (onboarding, entrenos completados, secuencia de días,    -->
<!--    peso, medidas, ánimo, diario de fotos) se guarda en el        -->
<!--    localStorage del propio dispositivo. No es una cuenta real    -->
<!--    sincronizada entre aparatos.                                  -->
<!--  Ver README para lo que falta para que sea un producto real.    -->
<!-- ============================================================= -->

<div id="bf">
  <main class="bf-stage" id="bfStage"></main>
  <nav class="bf-tabs" id="bfTabs">
    <button data-r="home"><span class="ic"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10.5V20h4v-6h4v6h4V10.5"/></svg></span><span>Inicio</span></button>
    <button data-r="workouts"><span class="ic"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="6" y1="18" x2="6" y2="10"/><line x1="12" y1="18" x2="12" y2="6"/><line x1="18" y1="18" x2="18" y2="13"/></svg></span><span>Entrenos</span></button>
    <button data-r="bonus"><span class="ic"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12v9H4v-9"/><path d="M2 7h20v5H2z"/><path d="M12 22V7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></svg></span><span>Bonos</span></button>
    <button data-r="recipes"><span class="ic"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3v6a2 2 0 0 0 4 0V3"/><line x1="9" y1="3" x2="9" y2="21"/><path d="M16 3c1.5 2.5 1.5 6.5 0 8-.4.5-.8.6-.8.6V21"/></svg></span><span>Recetas</span></button>
    <button data-r="progress"><span class="ic"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><line x1="8" y1="15" x2="8" y2="17"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="16" y1="8" x2="16" y2="17"/></svg></span><span>Progreso</span></button>
  </nav>
</div>

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800;900&family=Red+Hat+Display:wght@400;500;600;700;800&display=swap');
*{box-sizing:border-box}
:root{
  --bg:#FFF6F8; --bg2:#FFFFFF; --card:#FFFFFF; --card2:#FCEAEF; --line:#F3D7E0;
  --ink:#2B1620; --soft:#8A6472;
  --rose:#C2185B; --rose2:#E75480; --gold:#C9962C; --gold2:#E0B84D;
  --shadow:0 10px 28px rgba(194,24,91,.12);
}
html[data-theme="dark"]{
  --bg:#170D11; --bg2:#221217; --card:#221217; --card2:#2C1720; --line:#3A2029;
  --ink:#F7E9ED; --soft:#C297A2;
  --rose:#F0568A; --rose2:#F4789F; --gold:#E0B84D; --gold2:#EFCB6E;
  --shadow:0 10px 28px rgba(0,0,0,.4);
}
html,body{margin:0;padding:0;background:var(--bg)}
#bf,#bf *{box-sizing:border-box;margin:0;padding:0}
#bf{
  font-family:'Red Hat Display',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  color:var(--ink); background:var(--bg);
  max-width:520px; margin:0 auto; min-height:100vh; position:relative;
  -webkit-font-smoothing:antialiased; padding-bottom:78px;
  transition:background .2s,color .2s;
}
#bf h1,#bf h2,#bf h3{font-family:'Poppins',sans-serif;font-weight:700;line-height:1.25}
#bf button{font-family:inherit;cursor:pointer}
#bf a{color:inherit;text-decoration:none}
#bf input,#bf select,#bf textarea{font-family:inherit;color:inherit}

/* ===== top / nav ===== */
#bf .bf-top{display:flex;align-items:center;justify-content:space-between;padding:18px 18px 8px}
#bf .bf-logo{font-family:'Poppins';font-weight:900;font-size:17px;letter-spacing:-.02em}
#bf .bf-logo span{color:var(--rose)}
#bf .bf-gear{width:38px;height:38px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--ink);flex:none}
#bf .bf-pagebar{display:flex;align-items:center;gap:10px;padding:16px 18px 6px}
#bf .bf-back{width:36px;height:36px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:18px;flex:none;color:var(--ink)}
#bf .bf-pagebar h1{font-size:18px}
#bf .bf-stage{padding:0 18px 26px;animation:bfIn .3s ease}
@keyframes bfIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#bf .bf-tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:520px;background:var(--bg2);border-top:1px solid var(--line);display:flex;z-index:40;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
#bf .bf-tabs button{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--soft);font-size:10.5px;font-weight:700;padding:6px 2px;border-radius:10px}
#bf .bf-tabs button.active{color:var(--rose)}
#bf .bf-tabs .ic{display:flex}

/* ===== sections / cards ===== */
#bf .bf-sec{margin:20px 0 10px;font-size:15px;font-weight:700;font-family:'Poppins';display:flex;justify-content:space-between;align-items:center}
#bf .bf-sec .lnk{font-size:12.5px;font-weight:600;color:var(--rose)}
#bf .bf-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
#bf .bf-banner{background:linear-gradient(135deg,var(--rose),var(--rose2));color:#fff;border-radius:18px;padding:18px 20px;box-shadow:var(--shadow)}
#bf .bf-banner b{font-family:'Poppins';font-size:16px;display:block;margin-bottom:4px}
#bf .bf-banner p{font-size:12.5px;opacity:.92;line-height:1.45}
#bf .bf-banner .btn{background:#fff;color:var(--rose);font-weight:800;font-size:13px;padding:10px 18px;border-radius:22px;border:none;white-space:nowrap;margin-top:12px;display:inline-block}
#bf .bf-empty{background:var(--card);border:1px dashed var(--line);border-radius:16px;padding:22px;text-align:center}
#bf .bf-empty b{display:block;font-family:'Poppins';font-size:15px;margin-bottom:4px}
#bf .bf-empty p{color:var(--soft);font-size:13px}

/* ===== streak / day ring ===== */
#bf .bf-daybox{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
#bf .bf-ring{width:64px;height:64px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;position:relative}
#bf .bf-ring svg{position:absolute;inset:0}
#bf .bf-ring b{font-family:'Poppins';font-size:16px;z-index:1}
#bf .bf-ring small{position:absolute;bottom:-2px;font-size:8px;color:var(--soft);z-index:1;left:50%;transform:translate(-50%,14px)}
#bf .bf-daybox h3{font-size:14.5px;margin-bottom:3px}
#bf .bf-daybox p{font-size:12px;color:var(--soft)}
#bf .bf-streakpill{display:inline-flex;align-items:center;gap:4px;background:var(--card2);color:var(--rose);font-weight:800;font-size:11.5px;padding:4px 10px;border-radius:20px;margin-top:6px}

/* ===== grid tiles ===== */
#bf .bf-grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#bf .bf-tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
#bf .bf-tile .ic2{width:34px;height:34px;border-radius:10px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:16px;margin-bottom:9px}
#bf .bf-tile .lab{font-size:11.5px;color:var(--soft);margin-bottom:2px}
#bf .bf-tile .val{font-family:'Poppins';font-weight:800;font-size:17px}

/* ===== testimonials ===== */
#bf .bf-hscroll{display:flex;gap:12px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
#bf .bf-hscroll::-webkit-scrollbar{display:none}
#bf .bf-testi{flex:none;width:230px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
#bf .bf-testi-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
#bf .bf-testi-av{width:34px;height:34px;border-radius:50%;background:var(--rose2);color:#fff;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;flex:none}
#bf .bf-testi-head b{display:block;font-size:12.5px}
#bf .bf-testi-stars{font-size:10.5px;color:var(--gold)}
#bf .bf-testi p{font-size:12.5px;color:var(--soft);line-height:1.45;margin:0 0 10px}
#bf .bf-testi-result{display:inline-block;background:var(--card2);color:var(--rose);font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:20px}

/* ===== faq ===== */
#bf .bf-faq-item{border-bottom:1px solid var(--line)}
#bf .bf-faq-item:last-child{border-bottom:none}
#bf .bf-faq-q{width:100%;text-align:left;background:none;border:none;padding:14px 0;font-weight:700;font-size:13.5px;color:var(--ink);display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:inherit}
#bf .bf-faq-arrow{transition:transform .2s;color:var(--soft);flex:none}
#bf .bf-faq-item.open .bf-faq-arrow{transform:rotate(180deg)}
#bf .bf-faq-a{display:none;padding:0 0 14px;font-size:12.5px;color:var(--soft);line-height:1.55}
#bf .bf-faq-item.open .bf-faq-a{display:block}

/* ===== workout / exercise cards ===== */
#bf .bf-wcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
#bf .bf-wcard-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
#bf .bf-wcard h3{font-size:14.5px;margin-bottom:4px}
#bf .bf-wcard p{font-size:12px;color:var(--soft)}
#bf .bf-wcard .badge{background:var(--card2);color:var(--rose);font-size:10.5px;font-weight:800;padding:4px 9px;border-radius:20px;white-space:nowrap}
#bf .bf-wcard .badge.done{background:var(--rose);color:#fff}
#bf .bf-progbar{height:6px;border-radius:6px;background:var(--card2);margin:12px 0 2px;overflow:hidden}
#bf .bf-progbar i{display:block;height:100%;background:linear-gradient(90deg,var(--rose),var(--rose2));border-radius:6px}
#bf .bf-exlist{margin-top:12px;display:flex;flex-direction:column;gap:8px}
#bf .bf-exlist[hidden]{display:none}
#bf .bf-exitem{border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:var(--bg2)}
#bf .bf-exitem-top{display:flex;align-items:flex-start;gap:10px}
#bf .bf-chk{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;margin-top:1px;color:#fff;font-size:11px}
#bf .bf-chk.on{background:var(--rose);border-color:var(--rose)}
#bf .bf-exitem b{font-size:13px;display:block}
#bf .bf-exitem .sets{font-size:11px;color:var(--rose);font-weight:700;display:block;margin-top:1px}
#bf .bf-exitem p{font-size:11.5px;color:var(--soft);line-height:1.5;margin-top:6px}
#bf .bf-exitem.checked b, #bf .bf-exitem.checked .sets{opacity:.5}

/* ===== buttons ===== */
#bf .bf-btn{background:linear-gradient(135deg,var(--rose),var(--rose2));color:#fff;border:none;border-radius:24px;padding:13px 20px;font-weight:800;font-size:13.5px;width:100%;box-shadow:var(--shadow)}
#bf .bf-btn.ghost{background:var(--card);color:var(--rose);border:1.5px solid var(--rose)}
#bf .bf-btn.sm{width:auto;padding:9px 16px;font-size:12.5px;border-radius:20px}
#bf .bf-btn[disabled]{opacity:.5}

/* ===== calendar ===== */
#bf .bf-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
#bf .bf-calday{aspect-ratio:1;border-radius:9px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:800;color:var(--soft);position:relative}
#bf .bf-calday.rest{opacity:.45}
#bf .bf-calday.done{background:var(--rose);color:#fff}
#bf .bf-calday.today{outline:2px solid var(--rose);outline-offset:1px}

/* ===== onboarding ===== */
#bf .bf-onb{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:32px 24px;background:linear-gradient(180deg,var(--card2),var(--bg))}
#bf .bf-onb-logo{font-family:'Poppins';font-weight:900;font-size:26px;text-align:center;margin-bottom:6px}
#bf .bf-onb-logo span{color:var(--rose)}
#bf .bf-onb-sub{text-align:center;color:var(--soft);font-size:13px;margin-bottom:26px}
#bf .bf-onb h2{font-size:16.5px;margin-bottom:14px;text-align:center}
#bf .bf-opt{display:flex;flex-direction:column;gap:10px;margin-bottom:22px}
#bf .bf-opt button{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;text-align:left;font-size:13.5px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
#bf .bf-opt button.sel{border-color:var(--rose);background:var(--card2);color:var(--rose)}
#bf .bf-name-input{width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:14px 16px;font-size:14px;margin-bottom:22px}
#bf .bf-step-dots{display:flex;justify-content:center;gap:6px;margin-top:18px}
#bf .bf-step-dots i{width:6px;height:6px;border-radius:50%;background:var(--line);display:block}
#bf .bf-step-dots i.on{background:var(--rose);width:18px;border-radius:4px}

/* ===== bonus / recipe cards ===== */
#bf .bf-bonuscard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
#bf .bf-bonuscard-top{display:flex;gap:12px;align-items:flex-start}
#bf .bf-bonuscard .emoji{width:42px;height:42px;border-radius:12px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
#bf .bf-bonuscard h3{font-size:14px;margin-bottom:3px}
#bf .bf-bonuscard p{font-size:12px;color:var(--soft);line-height:1.4}
#bf .bf-tagrow{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;margin-bottom:14px}
#bf .bf-tagrow::-webkit-scrollbar{display:none}
#bf .bf-tag{flex:none;background:var(--card);border:1.5px solid var(--line);color:var(--soft);font-weight:700;font-size:12px;padding:8px 14px;border-radius:20px}
#bf .bf-tag.sel{background:var(--rose);border-color:var(--rose);color:#fff}
#bf .bf-recipe{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:10px}
#bf .bf-recipe-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
#bf .bf-recipe h3{font-size:13.5px}
#bf .bf-recipe .macro{font-size:10.5px;color:var(--rose);font-weight:800;white-space:nowrap}
#bf .bf-recipe .body{display:none;margin-top:9px;font-size:12px;color:var(--soft);line-height:1.55}
#bf .bf-recipe.open .body{display:block}
#bf .bf-recipe .arrow{color:var(--soft);transition:transform .2s}
#bf .bf-recipe.open .arrow{transform:rotate(180deg)}
#bf .bf-recipe .eyebrow{font-size:10px;font-weight:800;letter-spacing:.03em;color:var(--rose);text-transform:uppercase;margin-bottom:2px;display:block}
#bf .bf-ytlink{display:inline-flex;align-items:center;gap:6px;color:var(--rose);font-weight:700;font-size:12px;margin-top:10px}
#bf .bf-searchbox{width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:12px 14px;font-size:13.5px;margin-bottom:12px}

/* ===== progress inputs ===== */
#bf .bf-formrow{display:flex;gap:10px;margin-bottom:12px}
#bf .bf-formrow input{flex:1;border:1.5px solid var(--line);background:var(--bg2);border-radius:12px;padding:11px 12px;font-size:13.5px}
#bf .bf-moodrow{display:flex;justify-content:space-between;gap:8px;margin-top:6px}
#bf .bf-mood{flex:1;text-align:center;background:var(--card2);border:1.5px solid var(--line);border-radius:12px;padding:10px 4px;font-size:22px}
#bf .bf-mood span{display:block;font-size:9px;font-weight:700;color:var(--soft);margin-top:4px}
#bf .bf-mood.sel{border-color:var(--rose);background:rgba(194,24,91,.08)}
#bf .bf-bars{display:flex;align-items:flex-end;gap:6px;height:90px;margin-top:12px}
#bf .bf-bars .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
#bf .bf-bars .col i{width:100%;border-radius:5px 5px 0 0;background:linear-gradient(180deg,var(--rose2),var(--rose));display:block}
#bf .bf-bars .col small{font-size:8.5px;color:var(--soft)}
#bf .bf-photogrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
#bf .bf-photogrid .ph{aspect-ratio:1;border-radius:10px;background:var(--card2);border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:18px;color:var(--soft);position:relative}
#bf .bf-photogrid .ph img{width:100%;height:100%;object-fit:cover}
#bf .bf-photogrid .ph .dt{position:absolute;bottom:3px;left:0;right:0;text-align:center;font-size:8px;background:rgba(0,0,0,.55);color:#fff;padding:1px 0}

/* ===== modal ===== */
#bf .bf-modal-bg{position:fixed;inset:0;background:rgba(20,8,12,.55);z-index:90;display:flex;align-items:flex-end}
#bf .bf-modal{background:var(--bg2);width:100%;max-width:520px;margin:0 auto;border-radius:22px 22px 0 0;padding:22px 20px 28px;max-height:85vh;overflow-y:auto;animation:bfUp .25s ease}
@keyframes bfUp{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
#bf .bf-modal h2{font-size:16.5px;margin-bottom:12px}
#bf .bf-modal-row{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);font-size:13.5px}
#bf .bf-modal-row:last-child{border-bottom:none}
#bf .bf-modal-row .lab{color:var(--soft);font-size:12.5px}
#bf .bf-toggle{width:44px;height:26px;border-radius:20px;background:var(--card2);border:1px solid var(--line);position:relative}
#bf .bf-toggle i{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--soft);transition:.2s}
#bf .bf-toggle.on{background:var(--rose)}
#bf .bf-toggle.on i{left:20px;background:#fff}
#bf .bf-close{width:34px;height:34px;border-radius:50%;background:var(--card2);border:none;display:flex;align-items:center;justify-content:center;font-size:16px;margin-left:auto}

/* ===== toast / confetti ===== */
#bf .bf-toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg2);font-weight:700;font-size:12.5px;padding:11px 18px;border-radius:22px;z-index:120;box-shadow:0 8px 20px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .25s, transform .25s}
#bf .bf-toast.show{opacity:1;transform:translateX(-50%) translateY(-6px)}
#bf .bf-guarantee{display:flex;gap:10px;align-items:center;background:var(--card2);border-radius:14px;padding:13px 14px;font-size:11.5px;color:var(--soft);margin-top:6px}
#bf .bf-guarantee b{color:var(--ink)}
</style>

<script src="app-data.js"></script>
<script src="app.js"></script>
</body>
</html>
